# 在你 fork 的仓库里创建 .github/workflows/sync.yml
name: Sync from upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync all branches from upstream
        run: |
          git remote add upstream https://github.com/SSMGAlt/ManifestHub2.git
          git fetch upstream --no-tags

          git ls-remote upstream 'refs/heads/*' | awk '{print $2}' | \
          while read ref; do
            branch="${ref#refs/heads/}"
            git push origin "refs/remotes/upstream/${branch}:${ref}" 2>/dev/null || true
          done
